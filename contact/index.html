</nav></div></header><main class="container"><nav class="breadcrumb"><a href="../index.html">ホーム</a> ＞ お問い合わせ</nav>
<section class="section"><h1 style="color:var(--text-dark)">お問い合わせ</h1>
<div class="card"><p>ご質問・ご要望・不具合のご報告は下記フォームからお送りください。</p>
<p class="print-note">このサイトには送信先サーバーがありません。送信ボタンを押すと、入力内容をもとに<strong>お使いのメールアプリが開きます</strong>。宛先アドレス（example@example.com）は運営者の実際のアドレスに置き換えてご利用ください。</p>
<form id="contact-form">
<div class="field"><label for="c-name">お名前</label><input type="text" id="c-name" required></div>
<div class="field"><label for="c-email">返信先メールアドレス</label><input type="email" id="c-email" required></div>
<div class="field"><label for="c-subject">件名</label><input type="text" id="c-subject" required></div>
<div class="field"><label for="c-body">お問い合わせ内容</label><textarea id="c-body" required></textarea></div>
<button type="submit" class="btn">メールアプリで送信する</button>
</form></div></section></main><footer class="site-footer"><div class="footer-inner">
<div><strong style="color:#fff">Taskly</strong><br>面倒な事務作業を、ブラウザだけで簡単に。</div>
<nav><a href="../privacy/index.html">プライバシーポリシー</a>　<a href="../terms/index.html">利用規約</a>　<a href="../contact/index.html">お問い合わせ</a>　<a href="../about/index.html">サービスについて</a></nav>
</div><div class="copyright">© <span data-year>2026</span> Taskly</div></footer>
<div class="toast" role="status"></div><script src="../assets/js/common.js"></script>
<script>
document.getElementById('contact-form').addEventListener('submit', function (e) {
  e.preventDefault();
  var name=document.getElementById('c-name').value.trim(), email=document.getElementById('c-email').value.trim(),
      subject=document.getElementById('c-subject').value.trim(), body=document.getElementById('c-body').value.trim();
  if(!name||!email||!subject||!body){ BizToast('すべての項目を入力してください'); return; }
  var text = body + '\n\n---\nお名前: ' + name + '\n返信先: ' + email;
  window.location.href = 'mailto:example@example.com?subject=' + encodeURIComponent('[Taskly] ' + subject) + '&body=' + encodeURIComponent(text);
  BizToast('メールアプリを開きました');
});
</script></body></html>
